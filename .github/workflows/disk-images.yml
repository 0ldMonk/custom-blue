name: disk-images
on:
  schedule:
    - cron: "00 08 */3 * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
env:
  TAG: images-latest
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
jobs:
  # Create the release up front so the parallel matrix jobs don't race to create it.
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure rolling release exists
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Installer ISOs + VM disk image (rolling)" \
            --notes "Rolling Anaconda installer ISOs for every image plus a qcow2 disk for monk-blue-vm, rebuilt every ~3 days from each image's :latest tag. Assets over GitHub's 2 GiB cap are split into .partNN pieces (reassemble per the README); each artifact ships a .md5. Assets are overwritten in place."

  disk-images:
    needs: prepare-release
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: monk-blue-nvidia-gnome
            types: iso
          - image: monk-blue-vm
            types: iso qcow2
          - image: monk-blue-nvidia-niri
            types: iso
    env:
      IMAGE: ghcr.io/0ldmonk/${{ matrix.image }}:latest
    steps:
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Build with image-builder
        run: |
          set -euo pipefail
          mkdir -p output/iso output/qcow2
          sudo podman pull "$IMAGE"

          echo "Squashing image to 1 layer to avoid max depth limit..."
          sudo buildah from --name tmp-container "$IMAGE"
          sudo buildah commit --squash tmp-container "$IMAGE"
          sudo buildah rm tmp-container

          # BIB's anaconda-iso reads repos from the image's /etc/yum.repos.d, which Fedora 45 emptied,
          # so the ISO is a generic-iso built from our own Anaconda installer container instead.
          sudo podman build --build-arg IMAGE="$IMAGE" -t localhost/installer installer

          # qcow2's default root partition is too small to boot; size it up.
          printf '[[customizations.filesystem]]\nmountpoint = "/"\nminsize = "15 GiB"\n' > qcow2.toml

          ib() {
            sudo podman run --rm --privileged \
              --security-opt label=type:unconfined_t \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              -v "$PWD/output:/output" \
              -v "$PWD/qcow2.toml:/blueprint.toml:ro" \
              ghcr.io/osbuild/image-builder-cli:latest build "$@"
          }
          for t in ${{ matrix.types }}; do
            case "$t" in
              iso) ib --output-dir /output/iso --bootc-ref localhost/installer \
                     --bootc-installer-payload-ref "$IMAGE" --bootc-default-fs ext4 generic-iso ;;
              qcow2) ib --output-dir /output/qcow2 --blueprint /blueprint.toml \
                       --bootc-ref "$IMAGE" --bootc-default-fs ext4 qcow2 ;;
            esac
          done

      - name: Publish to rolling release
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" output

          publish() {
            local f="$1"
            md5sum "$f" > "$f.md5"
            # part count varies, so delete old parts first or stale ones linger
            gh release view "$TAG" --json assets -q '.assets[].name' \
              | grep -E "^$f(\.md5|\.part[0-9]+)?$" \
              | while read -r a; do gh release delete-asset "$TAG" "$a" -y; done || true
            if [ "$(stat -c%s "$f")" -ge $((1900 * 1024 * 1024)) ]; then
              split -b 1900M -d -a 2 "$f" "$f.part"; rm -f "$f"
              gh release upload "$TAG" "$f".part* "$f.md5" --clobber
            else
              gh release upload "$TAG" "$f" "$f.md5" --clobber
            fi
          }

          # image-builder names outputs after distro/type/arch, so locate them instead
          iso=$(find output/iso -name '*.iso' | head -n1)
          xz -T0 -c "$iso" > "${{ matrix.image }}-installer.iso.xz"
          publish "${{ matrix.image }}-installer.iso.xz"
          qcow2=$(find output/qcow2 -name '*.qcow2' | head -n1)
          if [ -n "$qcow2" ]; then
            mv "$qcow2" "${{ matrix.image }}.qcow2"
            publish "${{ matrix.image }}.qcow2"
          fi
