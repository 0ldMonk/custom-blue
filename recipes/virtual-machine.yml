---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: monk-blue-vm
description: This is my personal OS image (headless Proxmox VM; NAS tooling included but inert until enabled per-machine).

base-image: quay.io/fedora/fedora-bootc
image-version: "45"

modules:
  - from-file: modules/common-vm.yml

  # no systemd module on purpose: no preset enables cockpit/smb/nfs-server, so they stay off
  - type: dnf
    repos:
      copr:
        - gotmax23/mergerfs
      keys:
        - https://repo.45drives.com/key/gpg.asc
      files:
        - 45drives.repo
    install:
      packages:
        - mergerfs
        - snapraid
        - cockpit
        - cockpit-storaged
        - samba # cockpit-file-sharing doesn't pull smbd
        - nfs-utils
        - snapper
        - borgmatic
        # plain names, not `repo:` (repo-restricted, can't see Fedora's perl); includepkgs pins the source
        - cockpit-file-sharing
        - cockpit-identities

  - type: signing

  # must stay LAST (modules exec through nu); bootc doesn't need the cosign binary
  - type: script
    snippets:
      - "rm -f /usr/bin/cosign /usr/bin/bluebuild"
      - "rm -rf /usr/libexec/bluebuild"
