---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: monk-blue-nvidia-niri
description: This is my personal OS image (niri + dms, nvidia-hybrid — shared by the laptop (AMD iGPU) and the desktop (Intel iGPU)).

base-image: ghcr.io/ublue-os/base-main
image-version: "45"

modules:

  - from-file: modules/nvidia.yml # must stay FIRST (see nvidia-gnome.yml)

  - from-file: modules/common-files.yml
  - from-file: modules/common-fonts.yml
  - from-file: modules/common-kargs.yml
  - from-file: modules/common-niri-dms.yml
  - from-file: modules/common-packages.yml
  - from-file: modules/common-firefox.yml
  - type: signing

  # dms-greeter: reuses the danklinux COPR, no new upstream party
  - type: dnf
    repos:
      copr:
        - avengemedia/danklinux
    install:
      packages:
        - greetd
        - dms-greeter
        - kitty
  - type: files
    files:
      - source: niri
        destination: /
  - type: systemd
    system:
      enabled:
        - greetd.service
  - type: script
    snippets:
      - "systemctl set-default graphical.target"

  - type: files
    files:
      - source: nvidia-hybrid
        destination: /

  - type: kargs
    kargs:
      - rcutree.enable_rcu_lazy=1

  - type: dnf
    # tuned-ppd + bolt ship in silverblue-main, not base-main (no bolt = TB dock USB dead)
    install:
      packages:
        - pam-u2f
        - pamu2fcfg
        - fido2-tools
        - tuned-ppd
        - bolt
