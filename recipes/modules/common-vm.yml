---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
modules:
  - from-file: modules/common-files.yml
  - from-file: modules/common-cli.yml

  - type: dnf
    install:
      packages:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - cloud-init
        - qemu-guest-agent
        - node-exporter
        - cronie
        - zram-generator
        - wireguard-tools
        - autofs
        - moreutils
        - usbutils
        - borgbackup
        - rclone
        - hdparm
        - google-authenticator

  - from-file: modules/common-initrd-unlock.yml

  - type: kargs
    kargs:
      # no auditd here, so the kernel otherwise prints every unit start/stop to console + journal
      - audit=0
      # both, so the LUKS prompt reaches either Proxmox console; last (ttyS0) is /dev/console
      - console=tty0
      - console=ttyS0

  - type: files
    files:
      - source: vm
        destination: /

  # the files module doesn't preserve modes; sudo refuses anything but 0440
  - type: script
    snippets:
      - "chmod 0440 /etc/sudoers.d/pi"
      - "chmod 0755 /usr/libexec/rpm-ostree-reboot-required"
      - "chmod 0755 /usr/bin/enable-ssh-otp"

  - type: systemd
    system:
      enabled:
        - docker.service
        - docker.socket
        - node_exporter.service
        - rpm-ostree-reboot-required.timer
        - rpm-ostreed-automatic.timer
      # reboots on its own, ignoring AutomaticUpdatePolicy=stage; reboots are Ansible's
      masked:
        - bootc-fetch-apply-updates.timer

  # intel-gpu-firmware + linux-firmware-whence deliberately kept: pr1 passes through an iGPU
  - type: dnf
    remove:
      packages:
        - linux-firmware
        - nvidia-gpu-firmware
        - amd-gpu-firmware
        - amd-ucode-firmware
        - atheros-firmware
        - brcmfmac-firmware
        - cirrus-audio-firmware
        - intel-audio-firmware
        - mt7xxx-firmware
        - nxpwireless-firmware
        - qcom-wwan-firmware
        - realtek-firmware
        - tiwilink-firmware
