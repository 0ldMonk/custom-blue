---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: gnome-extensions
    install:
      - 1160  # Dash to Panel
      - 2932  # Executor
      - 4839  # Clipboard History
      - 517   # Caffeine
      - 2236  # Night Theme Switcher
      - 615   # AppIndicator and KStatusNotifierItem Support
     # - 9875  # O-tiling
      - 4998  # Legacy (GTK3) Theme Scheme Auto Switcher
     # - 1401  # Bluetooth Quick Connect — no GNOME 51 release yet
      - 3193  # Blur my Shell
     # - 10046 # Custom Touchpad Gestures — no GNOME 51 release yet
  - type: dnf
    repos:
      copr:
        - lizardbyte/stable # official sunshine repo
    install:
      packages:
        - gnome-tweaks
        - sunshine
