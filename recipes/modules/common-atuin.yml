---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # atuin's Fedora/COPR builds lag upstream, so fetch the latest release binary
  # directly. Unpinned by design (each build tracks newest). The sha256 check is
  # integrity only — it and the tarball both come from GitHub, so not provenance.
  - type: script
    snippets:
      - |
        set -euo pipefail
        base="https://github.com/atuinsh/atuin/releases/latest/download"
        # gnu, not musl: atuin's history sync resolves the server via getaddrinfo,
        # so it must use glibc NSS (systemd-resolved, mDNS) like the rest of the host.
        asset="atuin-x86_64-unknown-linux-gnu.tar.gz"
        tmp="$(mktemp -d)"
        curl -fsSL "$base/$asset" -o "$tmp/$asset"
        curl -fsSL "$base/$asset.sha256" -o "$tmp/$asset.sha256"
        ( cd "$tmp" && sha256sum -c "$asset.sha256" )
        tar -xzf "$tmp/$asset" -C "$tmp"
        install -Dm0755 "$tmp/atuin-x86_64-unknown-linux-gnu/atuin" /usr/bin/atuin
        rm -rf "$tmp"
