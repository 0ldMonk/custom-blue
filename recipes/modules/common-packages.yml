---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
modules:
  - from-file: modules/common-cli.yml
  - from-file: modules/common-initrd-unlock.yml
  - type: dnf
    repos:
      keys:
        - "https://repo.vscodium.dev/vscodium.gpg"
        - "https://pkg.claude-desktop-debian.dev/KEY.gpg"
      files:
        - "https://repo.vscodium.dev/vscodium.repo"
        - "https://pkg.claude-desktop-debian.dev/rpm/claude-desktop-unofficial.repo"
      nonfree: rpmfusion
    install:
      packages:
        - powertop
        - s-tui
        - python3-amd-debug-tools
        - codium # VSCodium: open-source VS Code build, no MS branding/telemetry
        - claude-desktop-unofficial
        - samba-client
        - gvfs-smb # Nautilus "Connect to Server..." SMB/CIFS support

  # nvidia-container-toolkit is in no Fedora repo and no live COPR (checked 2026-08).
  # docker-ce's own repo is already set up in common-cli.yml.
  - type: dnf
    repos:
      files:
        - nvidia-container-toolkit.repo # local file: files/dnf/nvidia-container-toolkit.repo
    install:
      packages:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - nvidia-container-toolkit
