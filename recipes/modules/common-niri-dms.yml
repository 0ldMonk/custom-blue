---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# niri + dms (Dank Material Shell) — the desktop stack for nvidia-niri.
# niri itself is official Fedora (43+), no COPR needed; quickshell/dgop and
# dms/dms-cli come from avengemedia's own COPRs (danklinux + dms) so there's
# only one upstream party behind the non-Fedora packages.
modules:
  - type: dnf
    repos:
      copr:
        - avengemedia/danklinux # quickshell-git, dgop
        - avengemedia/dms       # dms, dms-cli
    install:
      packages:
        - niri
        - quickshell-git
        - dgop
        - dms
        - dms-cli
        - cava             # audio visualizer widget
        - matugen           # wallpaper-based theming
        - qt6-qtmultimedia  # media-widget album art
