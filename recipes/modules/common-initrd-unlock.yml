---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
# inert until `enable-initrd-unlock`: dropbear only reaches the initrd via local regen
modules:
  - type: dnf
    repos:
      copr:
        - uriesk/dracut-crypt-ssh
    install:
      packages:
        - dracut-crypt-ssh

  - type: script
    snippets:
      - "chmod 0755 /usr/bin/enable-initrd-unlock"
