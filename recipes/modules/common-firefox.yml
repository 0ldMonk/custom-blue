---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# two transactions: firefox-langpacks pins Fedora firefox's exact EVR
modules:
  - type: dnf
    remove:
      packages:
        - firefox
        - firefox-langpacks
  - type: dnf
    repos:
      keys:
        - "https://packages.mozilla.org/rpm/firefox/signing-key.gpg"
      files:
        - "mozilla-firefox.repo"
    install:
      packages:
        - repo: mozilla-firefox
          packages:
            - firefox
