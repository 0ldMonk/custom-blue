---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      keys:
        - "https://pkgs.tailscale.com/stable/fedora/repo.gpg"
        - "https://download.docker.com/linux/fedora/gpg"
      files:
        - "https://pkgs.tailscale.com/stable/fedora/tailscale.repo"
        - "https://download.docker.com/linux/fedora/docker-ce.repo"
      copr:
        - atim/starship
    remove:
      packages:
        - nano-default-editor # conflicts with vim-default-editor
        - vim-minimal # owns /usr/bin/vi, replaced by the symlink below
    install:
      packages:
        - micro
        - vim-enhanced
        - vim-default-editor
        - iperf3
        - starship
        - zsh
        - zsh-autosuggestions
        - git
        - git-lfs
        - btop
        - htop
        - zoxide
        - fzf
        - jq
        - sysbench
        - stress-ng
        - tmux
        - tailscale
        - rsync
        - traceroute
        - fping
        - expect
        - axel
        - wget
        - smartmontools
        - hd-idle 
        - iftop
        - iotop
        - nmon
        - nvtop
        - compsize

  - type: script
    snippets:
      - "sed -i 's|^SHELL=.*|SHELL=/usr/bin/zsh|' /etc/default/useradd"
      - "usermod --shell /usr/bin/zsh root" # chsh is missing from the base image
      - "ln -sf vim /usr/bin/vi"
      - "echo 'source /etc/zsh-custom-config/zsh-extra.zsh' >> /etc/zshrc"

  # not named brew-upgrade.*: BlueBuild's brew module would overwrite it
  - type: systemd
    system:
      enabled:
        - brew-upgrade-monk-blue.timer
