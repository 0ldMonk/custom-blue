# fedora-bootc ships the zram-generator binary but not zram-generator-defaults,
# so without this file no zram device is ever created.
#
# zstd rather than the kernel default lzo-rle: these are headless VMs where CPU
# is cheaper than RAM. swap-priority keeps zram ahead of any disk swap tier a
# host may also have (blue has 8G on /dev/sdb at priority -1).
#
# /etc/systemd/zram-generator.conf replaces this entire file, not individual
# keys — that is the per-host override path.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
