[Unit]
Description=Discard unused filesystem blocks once a day

[Timer]
# empty assignment clears the vendor's weekly entry; OnCalendar is a list
OnCalendar=
# finish before the 01:00 Proxmox backups; vendor jitter (100min + 1h accuracy) would overlap them
OnCalendar=*-*-* 23:00:00
RandomizedDelaySec=0
AccuracySec=1min
