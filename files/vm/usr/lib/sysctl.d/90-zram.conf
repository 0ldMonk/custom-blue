# /usr/lib/sysctl.d, not /etc/sysctl.d like 99-ananicy.conf: several hosts
# already carry a hand-written /etc/sysctl.d/90-zram.conf, and a same-named
# file in /etc wins outright. Shipping to /etc would land as a locally-modified
# file that never picks up future image changes.
#
# swappiness 100 reads as alarming but is correct for zram: a swap-in is zstd
# decompression in RAM (microseconds), not a disk seek (milliseconds). It is
# wrong wherever swap is backed by a real disk — blue overrides it back to 60.
vm.swappiness = 100
vm.page-cluster = 0
