# not crypt-ssh.conf: /etc's merge would keep a local edit of that over ours
dropbear_port="2222"
dropbear_acl="/etc/dropbear/authorized_keys"

# SYSTEM = reuse sshd host keys; needs local regen (they don't exist at build time)
dropbear_rsa_key="SYSTEM"
dropbear_ecdsa_key="SYSTEM"
dropbear_ed25519_key="SYSTEM"
