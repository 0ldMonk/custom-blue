# Fleet user CA. Certs signed by it authenticate with no authorized_keys entry,
# so key rotation stops needing a per-machine push: /etc is 3-way merged and a
# rebuild reaches deployed machines, which ~/.ssh under /var never would.
#
# Purely additive — existing authorized_keys auth is untouched. A missing or
# malformed user_ca.pub is fail-open (sshd starts, plain key auth still works;
# verified). RevokedKeys is deliberately NOT set alongside it: that one fails
# CLOSED on an unreadable file and would lock every account out of every image.
TrustedUserCAKeys /etc/ssh/user_ca.pub
