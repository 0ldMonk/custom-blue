# --- core behaviour ---
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# truecolor + extended keys (needed for Claude Code etc.)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# --- keybindings ---
bind r source-file /etc/tmux.conf \; source-file -q ~/.tmux.conf \; display "tmux.conf reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind c new-window -c "#{pane_current_path}"

# --- status bar ---
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[fg=green,bold]#S #[fg=white]| "
set -g status-right "#[fg=cyan]#H #[fg=white]| #[fg=yellow]%Y-%m-%d %H:%M"
setw -g window-status-current-style "fg=black,bg=cyan,bold"

# no TPM: it would git-clone into every account's home on first start; opt in via ~/.tmux.conf
