# System-wide tmux defaults. tmux's compiled-in source path is
# /etc/tmux.conf:~/.tmux.conf:$XDG_CONFIG_HOME/tmux/tmux.conf — this file is
# read FIRST, so a per-user config still layers on top and wins. Reaches root
# too, which has no dotfiles at all (same reason as zsh-extra.zsh).

# --- core behaviour ---
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# truecolor + extended keys (needed for Claude Code etc.)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# --- keybindings ---
# reload both layers; -q so the user file being absent isn't an error
bind r source-file /etc/tmux.conf \; source-file -q ~/.tmux.conf \; display "tmux.conf reloaded"

# splits preserve CWD; | and - are intuitive
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# new window in current path
bind c new-window -c "#{pane_current_path}"

# --- status bar ---
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[fg=green,bold]#S #[fg=white]| "
set -g status-right "#[fg=cyan]#H #[fg=white]| #[fg=yellow]%Y-%m-%d %H:%M"
setw -g window-status-current-style "fg=black,bg=cyan,bold"

# TPM/plugin bootstrap deliberately omitted: it git-clones over the network on
# first tmux start, for every account including root, into ~/.tmux (i.e. /var —
# unreachable by an image rebuild). Opt in per-user via ~/.tmux.conf instead.
